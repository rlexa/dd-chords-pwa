sudo: false

language: node_js
# package.json has engineStrict: true and node: ^22.22.3 || ^24.15.0 || >=26.0.0,
# so `pnpm install --frozen-lockfile` fails unless CI's node is in that range.
node_js:
  - 24

branches:
  only:
    - main

cache:
  directories:
    - $HOME/.cache/pnpm
    - $HOME/.local/share/pnpm/store

before_install:
  - corepack enable
  - corepack prepare pnpm@11.8.0 --activate

before_script:
  - npm install -g firebase-tools

script:
  - pnpm install --frozen-lockfile
  - pnpm test
  - pnpm build

after_success:
  - firebase deploy --token "$FIREBASE_TOKEN"
