sudo: false

language: node_js
node_js:
  - 22

branches:
  only:
    - main

cache:
  directories:
    - $HOME/.cache/pnpm
    - $HOME/.local/share/pnpm/store

before_install:
  - corepack enable
  - corepack prepare pnpm@11.8.0 --activate

before_script:
  - npm install -g firebase-tools

script:
  - pnpm install --frozen-lockfile
  - pnpm test
  - pnpm build

after_success:
  - firebase deploy --token "$FIREBASE_TOKEN"
