# pnpm project settings (pnpm 11+). Machine-level settings (store dir, etc.) are ignored here.
# Install/postinstall scripts are blocked unless listed; strictDepBuilds (default true) aborts
# installs that need an unlisted package's build.
allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  lmdb: true
  msgpackr-extract: true
  fsevents: true
engineStrict: true
strictPeerDependencies: true
# Targeted peer exemption, not a global relaxation. @oxc-parser/binding-wasm32-wasi (an
# optional dep of @angular/build@22) declares @emnapi/{core,runtime} as
# dependencies pinned to 2.0.0-alpha.6, but @napi-rs/wasm-runtime@1.2.7's peer range
# ('^1.7.1 || 2.0.0-beta.2 || 2.0.0-beta.3') does not include alpha.6 — and 1.2.5, whose peer
# does accept alpha.4+, is excluded by oxc's '~1.2.6'. Upstream packaging bug (still present
# in oxc-parser 0.157.0). The wasm binding is optional and only used on wasm32-wasi, so we
# ignore just these two peer ranges instead of turning strictPeerDependencies off.
# pnpm 11 dropped `ignoreDependencies` from the peer checker — `filterPeerDependencyIssues2`
# only honours ignoreMissing/allowAny/allowedVersions, and this is a version mismatch ("bad"),
# not a missing peer, so only allowedVersions suppresses it. Scoped to the declaring package.
peerDependencyRules:
  allowedVersions:
    '@napi-rs/wasm-runtime':
      '@emnapi/core': '2.0.0-alpha.6 || 2.0.0-beta.2 || 2.0.0-beta.3 || ^1.7.1'
      '@emnapi/runtime': '2.0.0-alpha.6 || 2.0.0-beta.2 || 2.0.0-beta.3 || ^1.7.1'
